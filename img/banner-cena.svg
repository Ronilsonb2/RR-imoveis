<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="Cidade ao entardecer com uma casa à venda">
<!-- Banner da home: cena em vetor (leve e nítida em qualquer tela). Gerado por script; as mensagens ficam no HTML. -->
<defs>
  <linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0f172a"/>
    <stop offset=".55" stop-color="#334155"/>
    <stop offset=".82" stop-color="#9a6a63"/>
    <stop offset="1" stop-color="#f2b880"/>
  </linearGradient>
  <radialGradient id="brilho" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#ffe7b0" stop-opacity=".9"/>
    <stop offset="1" stop-color="#ffe7b0" stop-opacity="0"/>
  </radialGradient>
</defs>
<style>
  .estrela { fill: #fff; opacity: .2; animation: piscar 4s ease-in-out infinite; }
  .jf { fill: #fde68a; opacity: 0; animation: acender 12s ease-in-out infinite; }
  .jn { fill: #fcd34d; opacity: 0; animation: acender 12s ease-in-out infinite; }
  .sol { animation: pulsar 6s ease-in-out infinite; transform-origin: 470px 430px; }
  .placa { transform-origin: 452px 452px; animation: balanco 4s ease-in-out infinite; }
  .luz-casa { animation: acender-casa 12s ease-in-out infinite; }
  @keyframes piscar { 50% { opacity: .9; } }
  @keyframes acender { 0%, 10% { opacity: 0; } 30%, 85% { opacity: .95; } 100% { opacity: 0; } }
  @keyframes acender-casa { 0%, 15% { fill: #cbd5e1; } 30%, 85% { fill: #fcd34d; } 100% { fill: #cbd5e1; } }
  @keyframes pulsar { 50% { transform: scale(1.08); } }
  @keyframes balanco { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
  /* Quem desativa animações no sistema vê a cena parada, com as janelas acesas */
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
    .jf, .jn { opacity: .9; }
    .estrela { opacity: .6; }
  }
</style>

