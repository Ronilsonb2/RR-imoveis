<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Imóveis — Painel R&amp;R Imóveis</title>
    <link rel="icon" type="image/svg+xml" href="../img/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="css/admin.css">
</head>

<body>
    <nav class="navbar navbar-expand navbar-dark navbar-painel mb-4">
        <div class="container">
            <span class="navbar-brand">R&amp;R Painel</span>
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link active" href="index.html">Imóveis</a></li>
                <li class="nav-item"><a class="nav-link" href="proprietarios.html">Proprietários</a></li>
            </ul>
            <button id="btn-sair" class="btn btn-outline-light btn-sm">Sair</button>
        </div>
    </nav>

    <main class="container mb-5">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
            <h1 class="h4 mb-0">Imóveis</h1>
            <a href="imovel.html" class="btn btn-marca">+ Novo imóvel</a>
        </div>

        <form id="filtros" class="row g-2 mb-3">
            <div class="col-6 col-md-3">
                <select name="status" class="form-select" aria-label="Status">
                    <option value="">Todos os status</option>
                    <option value="ATIVO">Ativos</option>
                    <option value="RESERVADO">Reservados</option>
                    <option value="INATIVO">Inativos</option>
                    <option value="VENDIDO">Vendidos</option>
                    <option value="ALUGADO">Alugados</option>
                </select>
            </div>
            <div class="col-6 col-md-3">
                <select name="finalidadeImovel" class="form-select" aria-label="Finalidade">
                    <option value="">Todas as finalidades</option>
                    <option value="VENDA">Venda</option>
                    <option value="LOCACAO">Locação</option>
                    <option value="PERMUTA">Permuta</option>
                </select>
            </div>
            <div class="col-6 col-md-2">
                <select name="tipoDeImovel" class="form-select" aria-label="Tipo">
                    <option value="">Todos os tipos</option>
                    <option value="CASA">Casa</option>
                    <option value="APARTAMENTO">Apartamento</option>
                </select>
            </div>
            <div class="col-6 col-md-4">
                <input name="cidade" class="form-control" placeholder="Cidade" aria-label="Cidade">
            </div>
        </form>

        <div class="table-responsive bg-white rounded shadow-sm">
            <table class="table table-hover mb-0 tabela-imoveis">
                <thead class="table-light">
                    <tr>
                        <th>Foto</th>
                        <th>Imóvel</th>
                        <th>Local</th>
                        <th class="text-end">Preço</th>
                        <th>Status</th>
                        <th class="text-end">Ações</th>
                    </tr>
                </thead>
                <tbody id="lista-imoveis">
                    <tr><td colspan="6" class="text-center text-muted py-4">Carregando…</td></tr>
                </tbody>
            </table>
        </div>

        <div class="d-flex justify-content-between align-items-center mt-3">
            <span id="total" class="text-muted small"></span>
            <div class="btn-group">
                <button id="pagina-anterior" class="btn btn-outline-secondary btn-sm">‹ Anterior</button>
                <button id="pagina-proxima" class="btn btn-outline-secondary btn-sm">Próxima ›</button>
            </div>
        </div>
    </main>

    <script src="../js/config.js"></script>
    <script src="js/lista.js" type="module"></script>
</body>

</html>
