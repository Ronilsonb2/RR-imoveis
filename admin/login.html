<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Entrar — Painel</title>
    <link rel="icon" type="image/svg+xml" href="../img/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="css/admin.css">
</head>

<body>
    <main class="login-caixa px-3">
        <div class="text-center mb-4">
            <img data-empresa-logo alt="" class="bg-dark rounded p-2">
            <h1 class="h5 mt-3">Painel administrativo</h1>
        </div>

        <form id="form-login" class="secao-form" novalidate>
            <div id="erro-login" class="alert alert-danger d-none" role="alert"></div>

            <div class="mb-3">
                <label for="email" class="form-label">E-mail</label>
                <input type="email" id="email" class="form-control" autocomplete="username" required autofocus>
            </div>
            <div class="mb-3">
                <label for="senha" class="form-label">Senha</label>
                <input type="password" id="senha" class="form-control" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn btn-marca w-100">Entrar</button>
        </form>

        <p class="text-center small"><a href="../index.html">Voltar ao site</a></p>
    </main>

    <script src="../js/config.js"></script>
    <script src="../js/empresa.js"></script>
    <script src="js/login.js" type="module"></script>
</body>

</html>
