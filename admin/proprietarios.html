<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Proprietários — Painel R&amp;R Imóveis</title>
    <link rel="icon" type="image/svg+xml" href="../img/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="css/admin.css">
</head>

<body>
    <nav class="navbar navbar-expand navbar-dark navbar-painel mb-4">
        <div class="container">
            <span class="navbar-brand">R&amp;R Painel</span>
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">Imóveis</a></li>
                <li class="nav-item"><a class="nav-link active" href="proprietarios.html">Proprietários</a></li>
            </ul>
            <button id="btn-sair" class="btn btn-outline-light btn-sm">Sair</button>
        </div>
    </nav>

    <main class="container mb-5">
        <h1 class="h4 mb-3">Proprietários</h1>

        <form id="form-proprietario" class="secao-form" novalidate>
            <h2 id="titulo-form">Novo proprietário</h2>
            <div id="erro-form" class="alert alert-danger d-none" role="alert"></div>
            <div class="row g-3">
                <div class="col-md-3">
                    <label class="form-label" for="nome">Nome</label>
                    <input id="nome" name="nome" class="form-control" minlength="2" maxlength="100" required>
                    <div class="invalid-feedback">De 2 a 100 caracteres</div>
                </div>
                <div class="col-md-3">
                    <label class="form-label" for="cpf">CPF (só números)</label>
                    <input id="cpf" name="cpf" class="form-control" inputmode="numeric" pattern="\d{11}" maxlength="11" required>
                    <div class="invalid-feedback">CPF com 11 dígitos</div>
                </div>
                <div class="col-md-3">
                    <label class="form-label" for="telefone">Telefone com DDD</label>
                    <input id="telefone" name="telefone" class="form-control" inputmode="numeric" pattern="\d{10,11}" maxlength="11" required>
                    <div class="invalid-feedback">10 ou 11 dígitos</div>
                </div>
                <div class="col-md-3">
                    <label class="form-label" for="email">E-mail</label>
                    <input id="email" name="email" type="email" class="form-control" maxlength="80" required>
                    <div class="invalid-feedback">E-mail inválido</div>
                </div>
            </div>
            <div class="mt-3 d-flex gap-2">
                <button type="submit" class="btn btn-marca">Salvar</button>
                <button type="button" id="btn-cancelar" class="btn btn-outline-secondary d-none">Cancelar edição</button>
            </div>
        </form>

        <div class="table-responsive bg-white rounded shadow-sm">
            <table class="table table-hover mb-0 align-middle">
                <thead class="table-light">
                    <tr>
                        <th>Nome</th>
                        <th>CPF</th>
                        <th>Telefone</th>
                        <th>E-mail</th>
                        <th class="text-end">Ações</th>
                    </tr>
                </thead>
                <tbody id="lista-proprietarios">
                    <tr><td colspan="5" class="text-center text-muted py-4">Carregando…</td></tr>
                </tbody>
            </table>
        </div>

        <div class="d-flex justify-content-between align-items-center mt-3">
            <span id="total" class="text-muted small"></span>
            <div class="btn-group">
                <button id="pagina-anterior" class="btn btn-outline-secondary btn-sm">‹ Anterior</button>
                <button id="pagina-proxima" class="btn btn-outline-secondary btn-sm">Próxima ›</button>
            </div>
        </div>
    </main>

    <script src="../js/config.js"></script>
    <script src="js/proprietarios.js" type="module"></script>
</body>

</html>
