<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Usuários — Painel</title>
    <link rel="icon" type="image/svg+xml" href="../img/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="css/admin.css">
</head>

<body>
    <nav class="navbar navbar-expand navbar-dark navbar-painel mb-4">
        <div class="container">
            <span class="navbar-brand">Painel · <span data-empresa-nome></span></span>
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">Imóveis</a></li>
                <li class="nav-item"><a class="nav-link" href="proprietarios.html">Proprietários</a></li>
                <li class="nav-item"><a class="nav-link active" href="usuarios.html">Usuários</a></li>
            </ul>
            <button id="btn-sair" class="btn btn-outline-light btn-sm">Sair</button>
        </div>
    </nav>

    <main class="container mb-5">
        <h1 class="h4 mb-3">Usuários do painel</h1>

        <form id="form-senha" class="secao-form" novalidate>
            <h2>Alterar minha senha</h2>
            <div id="erro-senha" class="alert alert-danger d-none" role="alert"></div>
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label" for="senha-atual">Senha atual</label>
                    <input id="senha-atual" name="senhaAtual" type="password" class="form-control" autocomplete="current-password" required>
                    <div class="invalid-feedback">Informe a senha atual</div>
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="nova-senha">Nova senha</label>
                    <input id="nova-senha" name="novaSenha" type="password" class="form-control" minlength="8" maxlength="72" autocomplete="new-password" required>
                    <div class="invalid-feedback">De 8 a 72 caracteres</div>
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="confirmar-senha">Repita a nova senha</label>
                    <input id="confirmar-senha" type="password" class="form-control" autocomplete="new-password" required>
                    <div class="invalid-feedback">As senhas não conferem</div>
                </div>
            </div>
            <div class="mt-3">
                <button type="submit" class="btn btn-marca">Alterar senha</button>
            </div>
        </form>

        <form id="form-usuario" class="secao-form" novalidate>
            <h2 id="titulo-form">Novo usuário</h2>
            <div id="erro-form" class="alert alert-danger d-none" role="alert"></div>
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label" for="nome">Nome</label>
                    <input id="nome" name="nome" class="form-control" minlength="2" maxlength="100" required>
                    <div class="invalid-feedback">De 2 a 100 caracteres</div>
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="email">E-mail (usado no login)</label>
                    <input id="email" name="email" type="email" class="form-control" maxlength="80" required>
                    <div class="invalid-feedback">E-mail inválido</div>
                </div>
                <div class="col-md-4" id="grupo-senha">
                    <label class="form-label" for="senha">Senha inicial</label>
                    <input id="senha" name="senha" type="password" class="form-control" minlength="8" maxlength="72" autocomplete="new-password" required>
                    <div class="invalid-feedback">De 8 a 72 caracteres</div>
                </div>
            </div>
            <div class="mt-3 d-flex gap-2">
                <button type="submit" class="btn btn-marca">Salvar</button>
                <button type="button" id="btn-cancelar" class="btn btn-outline-secondary d-none">Cancelar edição</button>
            </div>
        </form>

        <div class="table-responsive bg-white rounded shadow-sm">
            <table class="table table-hover mb-0 align-middle">
                <thead class="table-light">
                    <tr>
                        <th>Nome</th>
                        <th>E-mail</th>
                        <th class="text-end">Ações</th>
                    </tr>
                </thead>
                <tbody id="lista-usuarios">
                    <tr><td colspan="3" class="text-center text-muted py-4">Carregando…</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <script src="../js/config.js"></script>
    <script src="../js/empresa.js"></script>
    <script src="js/usuarios.js" type="module"></script>
</body>

</html>
